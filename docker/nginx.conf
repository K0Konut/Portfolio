# Serveur du site pré-rendu (architecture technique §7). HTTPS et HSTS : Nginx Proxy Manager, devant ce conteneur.

# Langue de la page d'accueil « / » : l'anglais si le navigateur le demande en premier, sinon le français
map $http_accept_language $langue {
    ~*^en   en;
    default fr;
}

# Calculé sur l'adresse finale (après try_files) : une page est servie depuis son index.html
map $uri $cache {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~\.html$    "no-cache";
    # La redirection de « / » dépend de la langue du visiteur ; un CV mis à jour doit arriver tout de suite
    /           "no-store";
    ~^/cv/      "no-cache";
    default     "public, max-age=604800";
}

# Vide (en-tête absent) partout, sauf sur la redirection de « / »
map $uri $vary {
    /       "Accept-Language";
    default "";
}

# Page introuvable dans la langue de l'adresse ; hors préfixe de langue (/inconnu), le français par défaut
map $uri $page404 {
    ~^/en/  /en/404/index.html;
    default /fr/404/index.html;
}

server {
    listen 80;
    root /usr/share/nginx/html;

    server_tokens off;
    # Les redirections gardent le domaine vu par le visiteur, pas celui du conteneur
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml;

    # Tous les en-têtes ici seulement : un add_header dans un location effacerait ceux du serveur
    add_header Cache-Control $cache always;
    add_header Vary $vary always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' __SCRIPT_HASHES__; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' https://dashility.costamask.dev; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = / {
        return 302 /$langue;
    }

    # Pages pré-rendues en dossiers (fr/projets/index.html) : adresses sans « / » final ni « .html »
    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 $page404;
}
