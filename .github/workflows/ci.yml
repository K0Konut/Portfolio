# Vérifications de chaque PR vers dev ou main (architecture technique §7)
name: CI

on:
  pull_request:
    branches: [dev, main]

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint et format
        run: npm run lint && npm run format:check
      - name: Types
        run: npm run type-check
      - name: Tests unitaires
        run: npm test
      - name: Build (pré-rendu)
        run: npm run build
      - name: Navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Tests de bout en bout et accessibilité
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7
